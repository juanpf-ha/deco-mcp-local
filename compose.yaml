name: deco-mcp-local
services:
  deco-mcp:
    image: deco-mcp-local:0.1.0
    build:
      context: .
      target: runtime
    stdin_open: true
    tty: false
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: "none"
    environment:
      DECO_HOST: "${DECO_HOST:?Run scripts/enroll.py first}"
      DECO_TLS_SHA256: "${DECO_TLS_SHA256:?Enroll a verified certificate pin}"
      DECO_PASSWORD_FILE: /run/secrets/deco_password
      DECO_ALIAS_KEY_FILE: /run/secrets/alias_key
      DECO_REVEAL_IDENTIFIERS: "${DECO_REVEAL_IDENTIFIERS:-0}"
    secrets:
      - deco_password
      - alias_key
secrets:
  deco_password:
    file: ./secrets/deco_password
  alias_key:
    file: ./secrets/alias_key
