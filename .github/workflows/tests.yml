name: Synthetic security tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build locked test image (no router secrets)
        run: docker build --target test -t deco-mcp-local-test .
      - name: Exercise protocol and TLS offline
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m,mode=1777 --cap-drop ALL --security-opt no-new-privileges deco-mcp-local-test
